version: 2

models:
  - name: fct_orders
    description: "One row per order."
    data_tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 90000
          max_value: 110000
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_key
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customers'), field: customer_key}
      - name: purchase_date_key
        data_tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: order_status
        data_tests:
          - accepted_values:
              values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: review_score
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 1
              max_value: 5
              row_condition: "review_score is not null"

  - name: fct_order_items
    description: "One row per order item."
    columns:
      - name: order_item_key
        data_tests: [unique, not_null]
      - name: seller_key
        data_tests:
          - relationships: {to: ref('dim_sellers'), field: seller_key}
      - name: product_key
        data_tests:
          - relationships: {to: ref('dim_products'), field: product_key}

  - name: dim_customers
    columns:
      - name: customer_key
        data_tests: [unique, not_null]
  - name: dim_sellers
    columns:
      - name: seller_key
        data_tests: [unique, not_null]
  - name: dim_products
    columns:
      - name: product_key
        data_tests: [unique, not_null]